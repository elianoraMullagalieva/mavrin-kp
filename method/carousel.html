<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КП Маврин — 3D-карусель экранов</title>
<style>
/* 3D-карусель экранов КП: кольцо карточек, крутится само, тянется мышкой и пальцем */
@font-face { font-family: "Medeo Sans"; src: url("https://elianoramullagalieva.github.io/mavrin-kp/assets/fonts/MedeoSans.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --ink: #080808; --grey: #6c6c6c; --stone: #f2f2f0; --ease: cubic-bezier(.22, 1, .36, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #f2f2f0; color: var(--ink); font-family: "Medeo Sans", "Helvetica Neue", Arial, sans-serif; overflow: hidden; letter-spacing: -.01em; }
.top { position: absolute; z-index: 5; top: clamp(1rem, 3vw, 2rem); left: clamp(1rem, 3vw, 2.25rem); right: clamp(1rem, 3vw, 2.25rem); display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; pointer-events: none; }
.top h1 { margin: 0; font-weight: 500; font-size: clamp(1.5rem, 1rem + 2vw, 2.75rem); line-height: 1; letter-spacing: -.035em; }
.top h1 span { color: var(--grey); font-weight: 400; }
.top p { margin: .5rem 0 0; color: var(--grey); font-size: clamp(.95rem, .9rem + .2vw, 1.1rem); }
.cap { text-align: right; font-size: clamp(1rem, .9rem + .3vw, 1.25rem); max-width: 22ch; }
.cap b { display: block; font-weight: 500; }
.cap small { color: var(--grey); font-size: inherit; }
.stage { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 45%; cursor: grab; touch-action: pan-y; }
.stage:active { cursor: grabbing; }
.ring { position: absolute; left: 50%; top: 54%; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
.card { position: absolute; width: var(--w); left: calc(var(--w) / -2); top: calc(var(--h) / -2); height: var(--h); border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px -30px rgba(8,8,8,.35); backface-visibility: hidden; transition: opacity .6s var(--ease), filter .6s var(--ease); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; pointer-events: none; user-select: none; }
.card.far { opacity: .55; filter: saturate(.6); }
.dots { position: absolute; z-index: 5; bottom: clamp(1rem, 3vw, 1.75rem); left: 50%; transform: translateX(-50%); display: flex; gap: .4rem; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(8,8,8,.18); transition: background .4s, transform .4s; }
.dots i.on { background: var(--ink); transform: scale(1.3); }
.hint { position: absolute; z-index: 5; bottom: clamp(1rem, 3vw, 1.75rem); right: clamp(1rem, 3vw, 2.25rem); color: var(--grey); font-size: .95rem; }
@media (max-width: 640px) { .cap { display: none; } .hint { display: none; } }
</style>
</head>
<body>
<div class="top">
  <div><h1>КП за 3,5 часа <span>· кейс Маврина</span></h1><p>Все экраны предложения по кругу</p></div>
  <div class="cap" id="cap"><b>Первый экран</b><small>Пауза. Ход. Сделка.</small></div>
</div>
<div class="stage" id="stage"><div class="ring" id="ring"></div></div>
<div class="dots" id="dots"></div>
<div class="hint">Тяните, чтобы покрутить</div>
<script>
(() => {
  const B = 'https://elianoramullagalieva.github.io/mavrin-kp/method/';
  const S = [
    ['01-hero.jpg', 'Первый экран', 'Пауза. Ход. Сделка.'],
    ['01-hero-indigo.jpg', 'Цвет стены: индиго', 'Тексты светлеют сами'],
    ['02-research.jpg', 'Мини-исследование', 'Сейчас / Сделаем'],
    ['03-aud.jpg', 'Для кого сайт', 'Три входа с мини-фото'],
    ['04-ideas.jpg', 'Персональные идеи', 'Переход с фото дизайнера'],
    ['05-quiz.jpg', 'Разбор за 4 клика', 'Квиз, стоп-лист, контакт'],
    ['06-mirror.jpg', 'Зеркало', 'Узнаёте себя?'],
    ['07-products.jpg', 'Флагманские курсы', 'Сторис и страница курса'],
    ['08-posters.jpg', 'Афиши встреч', 'Постеры с лицом эксперта'],
    ['01-hero-terra.jpg', 'Цвет стены: терракота', 'Один кадр — три настроения'],
    ['10-price.jpg', 'Цены', 'Три тарифа и рассрочка'],
    ['11-final.jpg', 'Финал', 'Ваш ход, Олег']
  ];
  const ring = document.getElementById('ring'), stage = document.getElementById('stage'), dots = document.getElementById('dots'), cap = document.getElementById('cap');
  const N = S.length, step = 360 / N;
  let W, H, R;
  const size = () => {
    W = Math.min(Math.max(innerWidth * .34, 240), 620); H = W * .62;
    R = Math.round((W / 2) / Math.tan(Math.PI / N)) + 40;
    ring.style.setProperty('--w', W + 'px'); ring.style.setProperty('--h', H + 'px');
    [...ring.children].forEach((c, i) => c.style.transform = `rotateY(${i * step}deg) translateZ(${R}px)`);
  };
  S.forEach(([f, t, d], i) => {
    const c = document.createElement('div'); c.className = 'card';
    const im = new Image(); im.src = B + f; im.alt = t; im.decoding = 'async'; im.loading = i < 4 ? 'eager' : 'lazy';
    c.append(im); ring.append(c); dots.append(document.createElement('i'));
  });
  size(); addEventListener('resize', size);
  let a = 0, v = -0.06, drag = false, x0 = 0, last = 0, idle = 0;
  const tilt = -6;
  const frame = t => {
    const dt = Math.min(48, t - (last || t)); last = t;
    if (!drag) { idle += dt; a += v * dt; v += ((-0.012) - v) * 0.02; }
    ring.style.transform = `translateZ(${-R}px) rotateX(${tilt}deg) rotateY(${a}deg)`;
    const k = ((Math.round(-a / step) % N) + N) % N;
    [...ring.children].forEach((c, i) => { const d = Math.min((i - k + N) % N, (k - i + N) % N); c.classList.toggle('far', d > 2); });
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i === k));
    if (cap.dataset.k != k) { cap.dataset.k = k; cap.innerHTML = `<b>${S[k][1]}</b><small>${S[k][2]}</small>`; }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  const down = e => { drag = true; x0 = (e.touches ? e.touches[0] : e).clientX; v = 0; };
  const move = e => { if (!drag) return; const x = (e.touches ? e.touches[0] : e).clientX; const d = (x - x0) * .18; a += d; v = d / 16; x0 = x; };
  const up = () => { drag = false; };
  stage.addEventListener('pointerdown', down); addEventListener('pointermove', move); addEventListener('pointerup', up);
  stage.addEventListener('touchstart', down, { passive: true }); addEventListener('touchmove', move, { passive: true }); addEventListener('touchend', up);
})();
</script>
</body>
</html>
